<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Creeper • Ultra</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #0a0a0a;
    color: #e5e5e5;
  }
  .sidebar {
    background: #111111;
    border-right: 1px solid #222;
  }
  .message-user {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
  }
  .input-box {
    background: #151515;
    border: 1px solid #2a2a2a;
  }
  .input-box:focus-within {
    border-color: #3f3f3f;
  }
  #chat-box::-webkit-scrollbar { width: 5px; }
  #chat-box::-webkit-scrollbar-track { background: transparent; }
  #chat-box::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  .tier-pill {
    background: #1c1c1c;
    border-radius: 9999px;
    padding: 3px;
  }
  .tier-btn {
    padding: 6px 14px;
    border-radius: 9999px;
    font-size: 13px;
    font-weight: 500;
    color: #a1a1aa;
    transition: all 0.2s;
  }
  .tier-btn.active {
    background: #2a2a2a;
    color: white;
  }
  pre {
    background: #111;
    border: 1px solid #222;
    border-radius: 10px;
    padding: 14px;
    font-size: 12.5px;
    overflow-x: auto;
    color: #86efac;
  }
</style>
</head>
<body class="h-screen flex overflow-hidden">

<!-- SIDEBAR -->
<aside class="sidebar w-64 flex-shrink-0 flex flex-col h-full hidden lg:flex">
  <div class="p-4 border-b border-zinc-800">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-white flex items-center justify-center text-black font-bold text-sm">C</div>
      <div>
        <div class="font-semibold text-sm">Creeper</div>
        <div class="text-[11px] text-zinc-500">AI</div>
      </div>
    </div>
  </div>

  <div class="p-3 flex-1 overflow-y-auto">
    <div class="text-[11px] font-medium text-zinc-500 uppercase tracking-wider mb-3 px-2">Models</div>
    
    <button onclick="selectTier('plus')" id="btn-plus" class="w-full text-left px-3 py-2.5 rounded-lg text-sm mb-1 hover:bg-zinc-800/70 transition">
      <div class="font-medium">Plus</div>
      <div class="text-xs text-zinc-500">Basic</div>
    </button>
    
    <button onclick="selectTier('premium')" id="btn-premium" class="w-full text-left px-3 py-2.5 rounded-lg text-sm mb-1 hover:bg-zinc-800/70 transition">
      <div class="font-medium">Premium</div>
      <div class="text-xs text-zinc-500">Better reasoning</div>
    </button>
    
    <button onclick="selectTier('super')" id="btn-super" class="w-full text-left px-3 py-2.5 rounded-lg text-sm mb-1 hover:bg-zinc-800/70 transition">
      <div class="font-medium">Super</div>
      <div class="text-xs text-zinc-500">Strong + tools</div>
    </button>
    
    <button onclick="selectTier('ultra')" id="btn-ultra" class="w-full text-left px-3 py-2.5 rounded-lg text-sm mb-1 hover:bg-zinc-800/70 transition">
      <div class="font-medium text-white">Ultra</div>
      <div class="text-xs text-zinc-400">Most powerful model</div>
    </button>

    <div class="mt-8 text-[11px] font-medium text-zinc-500 uppercase tracking-wider mb-2 px-2">Tools</div>
    <button onclick="generateImage()" class="w-full text-left px-3 py-2 rounded-lg text-sm text-zinc-400 hover:bg-zinc-800 hover:text-white transition">Generate Image</button>
    <button onclick="generateVideo()" class="w-full text-left px-3 py-2 rounded-lg text-sm text-zinc-400 hover:bg-zinc-800 hover:text-white transition">Generate Video</button>
    <button onclick="openCodeGenerator()" class="w-full text-left px-3 py-2 rounded-lg text-sm text-zinc-400 hover:bg-zinc-800 hover:text-white transition">Code Generator</button>
    <button onclick="clearChat()" class="w-full text-left px-3 py-2 rounded-lg text-sm text-zinc-400 hover:bg-zinc-800 hover:text-red-400 transition">Clear Chat</button>
  </div>
</aside>

<!-- MAIN -->
<main class="flex-1 flex flex-col h-full">
  <!-- Mobile header -->
  <div class="lg:hidden flex items-center justify-between px-4 py-3 border-b border-zinc-800">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-md bg-white flex items-center justify-center text-black font-bold text-xs">C</div>
      <span class="font-medium text-sm" id="mobile-tier">Plus</span>
    </div>
    <button onclick="document.getElementById('mobile-menu').classList.toggle('hidden')" class="text-zinc-400 text-sm">Models</button>
  </div>

  <div id="mobile-menu" class="lg:hidden hidden border-b border-zinc-800 bg-zinc-900 p-3 space-y-1">
    <button onclick="selectTier('plus');document.getElementById('mobile-menu').classList.add('hidden')" class="w-full text-left px-3 py-2 rounded text-sm">Plus</button>
    <button onclick="selectTier('premium');document.getElementById('mobile-menu').classList.add('hidden')" class="w-full text-left px-3 py-2 rounded text-sm">Premium</button>
    <button onclick="selectTier('super');document.getElementById('mobile-menu').classList.add('hidden')" class="w-full text-left px-3 py-2 rounded text-sm">Super</button>
    <button onclick="selectTier('ultra');document.getElementById('mobile-menu').classList.add('hidden')" class="w-full text-left px-3 py-2 rounded text-sm font-medium">Ultra</button>
  </div>

  <!-- Chat -->
  <div id="chat-box" class="flex-1 overflow-y-auto px-4 py-6 md:px-8 space-y-6"></div>

  <!-- Input -->
  <div class="px-4 pb-5 md:px-8">
    <div class="max-w-3xl mx-auto">
      <!-- Tier selector (desktop style like the screenshot) -->
      <div class="flex justify-center mb-4">
        <div class="tier-pill flex items-center gap-1">
          <button onclick="selectTier('plus')" id="pill-plus" class="tier-btn">Plus</button>
          <button onclick="selectTier('premium')" id="pill-premium" class="tier-btn">Premium</button>
          <button onclick="selectTier('super')" id="pill-super" class="tier-btn">Super</button>
          <button onclick="selectTier('ultra')" id="pill-ultra" class="tier-btn">Ultra</button>
        </div>
      </div>

      <div class="input-box rounded-2xl px-4 py-3 flex items-end gap-3">
        <textarea id="user-input" rows="1" placeholder="Ask Creeper anything..."
          class="flex-1 bg-transparent resize-none outline-none text-[15px] placeholder-zinc-500 max-h-40 leading-relaxed"
          onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); sendMessage();}"></textarea>
        <button onclick="sendMessage()" class="bg-white text-black hover:bg-zinc-200 rounded-xl px-4 py-2 text-sm font-medium transition">
          Send
        </button>
      </div>
      <div class="text-center text-[11px] text-zinc-600 mt-2" id="tier-hint">
        Plus • Basic answers
      </div>
    </div>
  </div>
</main>

<script>
  let currentTier = 'plus';
  let chatHistory = [];

  const tierConfig = {
    plus: {
      name: 'Plus',
      hint: 'Plus • Basic answers',
      label: 'Plus'
    },
    premium: {
      name: 'Premium',
      hint: 'Premium • Better reasoning',
      label: 'Premium'
    },
    super: {
      name: 'Super',
      hint: 'Super • Strong model + tools',
      label: 'Super'
    },
    ultra: {
      name: 'Ultra',
      hint: 'Ultra • Most powerful Chat model',
      label: 'Ultra'
    }
  };

  window.onload = () => {
    const saved = localStorage.getItem('creeper_tier');
    if (saved && tierConfig[saved]) selectTier(saved, false);
    else selectTier('plus', false);

    addAIMessage(`Welcome to <strong>Creeper</strong>.<br><br>
    Select <strong>Ultra</strong> for the most powerful chat model — deepest intelligence, highest quality answers, and maximum capability (equivalent to the top paid tier).`);
  };

  function selectTier(tier, showMessage = true) {
    currentTier = tier;
    const cfg = tierConfig[tier];

    // Update sidebar buttons
    ['plus','premium','super','ultra'].forEach(t => {
      const btn = document.getElementById('btn-' + t);
      if (btn) {
        btn.classList.toggle('bg-zinc-800', t === tier);
      }
    });

    // Update pill selector
    ['plus','premium','super','ultra'].forEach(t => {
      const pill = document.getElementById('pill-' + t);
      if (pill) {
        pill.classList.toggle('active', t === tier);
      }
    });

    document.getElementById('tier-hint').textContent = cfg.hint;
    document.getElementById('mobile-tier').textContent = cfg.label;
    localStorage.setItem('creeper_tier', tier);

    if (showMessage) {
      if (tier === 'ultra') {
        addAIMessage(`<strong>Ultra</strong> activated.<br><br>
        You are now using the <strong>most powerful Chat model</strong>.<br>
        • Highest intelligence<br>
        • Deepest reasoning<br>
        • Fastest & highest quality responses<br>
        • Full systems, code, websites, games, and advanced scripts<br><br>
        Ask me anything.`);
      } else {
        addAIMessage(`Switched to <strong>${cfg.name}</strong>.`);
      }
    }
  }

  function addMessage(content, isUser = false) {
    const box = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.className = `max-w-3xl mx-auto ${isUser ? 'flex justify-end' : ''}`;
    
    if (isUser) {
      div.innerHTML = `
        <div class="message-user rounded-2xl px-4 py-3 text-[15px] leading-relaxed max-w-[85%]">
          ${content}
        </div>`;
    } else {
      div.innerHTML = `
        <div class="text-[15px] leading-relaxed">
          <div class="flex items-center gap-2 mb-2">
            <div class="w-6 h-6 rounded-md bg-white flex items-center justify-center text-black text-xs font-bold">C</div>
            <span class="text-sm font-medium text-zinc-300">${tierConfig[currentTier].name}</span>
          </div>
          <div class="pl-8">${content}</div>
        </div>`;
    }
    
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;

    if (currentTier === 'super' || currentTier === 'ultra') {
      chatHistory.push({ role: isUser ? 'user' : 'ai', content });
      localStorage.setItem('creeper_chat', JSON.stringify(chatHistory));
    }
  }

  function addAIMessage(content) {
    addMessage(content, false);
  }

  function sendMessage() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, true);
    input.value = '';
    input.style.height = 'auto';

    // Ultra feels slightly more thoughtful
    const delay = currentTier === 'ultra' ? 1100 + Math.random() * 900 : 550 + Math.random() * 500;

    setTimeout(() => {
      addAIMessage(generateResponse(text));
    }, delay);
  }

  document.getElementById('user-input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 160) + 'px';
  });

  // ====================== RESPONSE ENGINE ======================
  function generateResponse(userText) {
    const lower = userText.toLowerCase();
    const tier = currentTier;

    // ===== ULTRA (Most powerful) =====
    if (tier === 'ultra') {
      if (lower.includes('infinite stamina') || lower.includes('stamina')) return ultraScript('Infinite Stamina');
      if (lower.includes('infinite jump') || lower.includes('jump')) return ultraScript('Infinite Jump');
      if (lower.includes('speed')) return ultraScript('Speed Changer');
      if (lower.includes('spiderman') || lower.includes('spider-man')) return ultraScript('Spider-Man');
      if (lower.includes('batman')) return ultraScript('Batman');
      if (lower.includes('superman')) return ultraScript('Superman');
      if (lower.includes('god mode') || lower.includes('godmode')) return ultraScript('God Mode');
      if (lower.includes('website') || lower.includes('landing')) return ultraWebsite();
      if (lower.includes('game') || lower.includes('roblox')) return ultraGame();
      if (lower.includes('app') || lower.includes('mobile')) return ultraApp();

      return `
        <p class="mb-3">You’re asking about: <strong>"${userText}"</strong></p>
        
        <p class="mb-3">I’m running on the <strong>most powerful Chat model</strong> (Ultra). I will give you the highest quality answer possible — clear, deep, and useful.</p>
        
        <p class="mb-3">I can:</p>
        <ul class="list-disc list-inside space-y-1 mb-4 text-zinc-300">
          <li>Reason at maximum depth</li>
          <li>Write complete professional systems and code</li>
          <li>Build full websites, apps, and games</li>
          <li>Create advanced scripts (stamina, jump, speed, hero systems, god mode, etc.)</li>
        </ul>
        
        <p>Tell me exactly what you want and how detailed you need it. I’ll go as far as required.</p>
      `;
    }

    // ===== SUPER =====
    if (tier === 'super') {
      return `Super model response for <strong>${userText}</strong>.<br><br>
      Good quality answers + tools. For the <strong>most powerful</strong> model and maximum intelligence, switch to <strong>Ultra</strong>.`;
    }

    // ===== PREMIUM =====
    if (tier === 'premium') {
      return `Premium response about <strong>${userText}</strong>.<br><br>
      Better reasoning than Plus. Use Super or Ultra for stronger performance.`;
    }

    // ===== PLUS =====
    return `Plus answer: ${userText}<br><br>
    <span class="text-zinc-500 text-sm">Basic model. Switch to Ultra for the most powerful intelligence.</span>`;
  }

  function ultraScript(type) {
    const scripts = {
      'Infinite Stamina': `-- Ultra • Infinite Stamina (Most Powerful Model)
local Players = game:GetService("Players")
local player = Players.LocalPlayer

local function apply(character)
    local humanoid = character:WaitForChild("Humanoid")
    task.spawn(function()
        while character and character.Parent do
            pcall(function()
                local s = humanoid:FindFirstChild("Stamina") or humanoid:FindFirstChild("Energy")
                if s then s.Value = math.huge end
            end)
            task.wait(0.1)
        end
    end)
end

if player.Character then apply(player.Character) end
player.CharacterAdded:Connect(apply)
print("[Ultra] Infinite Stamina online")`,

      'Infinite Jump': `-- Ultra • Infinite Jump
local UIS = game:GetService("UserInputService")
local player = game.Players.LocalPlayer

UIS.JumpRequest:Connect(function()
    local char = player.Character
    if char and char:FindFirstChildOfClass("Humanoid") then
        char.Humanoid:ChangeState(Enum.HumanoidStateType.Jumping)
    end
end)
print("[Ultra] Infinite Jump active")`,

      'Speed Changer': `-- Ultra • Speed Controller
local player = game.Players.LocalPlayer
local SPEED = 50

local function set(character)
    local humanoid = character:WaitForChild("Humanoid")
    humanoid.WalkSpeed = SPEED
    humanoid:GetPropertyChangedSignal("WalkSpeed"):Connect(function()
        humanoid.WalkSpeed = SPEED
    end)
end

if player.Character then set(player.Character) end
player.CharacterAdded:Connect(set)
print("[Ultra] Speed locked at " .. SPEED)`,

      'Spider-Man': `-- Ultra • Spider-Man System
local UIS = game:GetService("UserInputService")
local swinging = false

UIS.InputBegan:Connect(function(input, gpe)
    if gpe then return end
    if input.KeyCode == Enum.KeyCode.E then
        swinging = not swinging
        print(swinging and "Web engaged" or "Web released")
    end
end)
print("[Ultra] Spider-Man core ready")`,

      'Batman': `-- Ultra • Batman Utility
local UIS = game:GetService("UserInputService")
UIS.InputBegan:Connect(function(input, gpe)
    if gpe then return end
    if input.KeyCode == Enum.KeyCode.Q then print("Grapple") end
    if input.KeyCode == Enum.KeyCode.F then print("Smoke Bomb") end
end)
print("[Ultra] Batman ready")`,

      'Superman': `-- Ultra • Superman
local player = game.Players.LocalPlayer
local char = player.Character or player.CharacterAdded:Wait()
local humanoid = char:WaitForChild("Humanoid")
humanoid.WalkSpeed = 90
humanoid.JumpPower = 120
print("[Ultra] Superman core online")`,

      'God Mode': `-- Ultra • God Mode
local player = game.Players.LocalPlayer
local function god(character)
    local h = character:WaitForChild("Humanoid")
    h.MaxHealth = math.huge
    h.Health = math.huge
    h.HealthChanged:Connect(function() h.Health = h.MaxHealth end)
end
if player.Character then god(player.Character) end
player.CharacterAdded:Connect(god)
print("[Ultra] God Mode activated")`
    };

    return `
      <p class="mb-3"><strong>Ultra</strong> (Most powerful model) generated this:</p>
      <pre>${scripts[type]}</pre>
      <p class="mt-3 text-sm text-zinc-400">Clean and ready. Want a more advanced version? Just ask.</p>
    `;
  }

  function ultraWebsite() {
    return `<p><strong>Ultra</strong> — Most powerful model</p>
    <p class="mt-2">I can generate complete, modern, production-ready websites with clean architecture and professional quality.</p>
    <p class="mt-2">Tell me the exact type of website you want.</p>`;
  }

  function ultraGame() {
    return `<p><strong>Ultra</strong> — Most powerful model</p>
    <p class="mt-2">I can create full game systems and frameworks. What genre and features do you need?</p>`;
  }

  function ultraApp() {
    return `<p><strong>Ultra</strong> — Most powerful model</p>
    <p class="mt-2">I can design and generate complete app foundations. Describe the app.</p>`;
  }

  function generateImage() {
    if (currentTier !== 'super' && currentTier !== 'ultra') {
      addAIMessage("Image generation requires Super or Ultra.");
      return;
    }
    addAIMessage("Image generation ready. Describe what you want.");
  }

  function generateVideo() {
    if (currentTier !== 'super' && currentTier !== 'ultra') {
      addAIMessage("Video generation requires Super or Ultra.");
      return;
    }
    addAIMessage("Video generation ready. Describe the scene.");
  }

  function openCodeGenerator() {
    document.getElementById('user-input').value = "Build a complete professional system for: ";
    document.getElementById('user-input').focus();
  }

  function clearChat() {
    document.getElementById('chat-box').innerHTML = '';
    chatHistory = [];
    localStorage.removeItem('creeper_chat');
    addAIMessage("Chat cleared.");
  }
</script>
</body>
</html>
